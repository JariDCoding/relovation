# Sveltia CMS — Relovation
#
# LET OP: dit bestand wordt gegenereerd door tools/build-cms-config.mjs uit de
# bestanden in content/nl/. Wijzig het niet met de hand; markeer een element in
# de HTML met data-cms, draai `npm run content:extract` en daarna
# `npm run cms:config`.
#
# Git-backend: opslaan is een commit naar GitHub, en die commit deployt.
# Geen enkel secret aan de site-kant; het OAuth-secret staat op de gedeelde
# Worker auth.jdcreations.co.
backend:
  name: github
  repo: JariDCoding/relovation
  branch: main
  base_url: https://auth.jdcreations.co
  commit_messages:
    update: "Content: {{collection}} · {{slug}} bijgewerkt via CMS"

locale: nl

# Nederlands en Engels naast elkaar in hetzelfde scherm. multiple_folders zet
# de bestanden in content/nl/... en content/en/..., waar de build ze verwacht.
i18n:
  structure: multiple_folders
  locales: [nl, en]
  default_locale: nl

media_folder: "public/uploads"
public_folder: "/uploads"

# Allemaal `files`-collecties: Robin bewerkt bestaande teksten en kan geen
# pagina's bijmaken of verwijderen. De structuur van de site blijft intact.
collections:
  - name: "instellingen"
    label: "Site-instellingen"
    i18n: true
    files:
      - name: "global"
        label: "Footer & sociale media"
        file: "content/{{locale}}/settings/global.json"
        i18n: true
        description: "Staat op elke pagina."
        fields:
          - label: "Footer"
            name: "footer"
            widget: "object"
            i18n: true
            fields:
              - { label: "E-mailadres", name: "email", widget: "string", i18n: duplicate }
              - { label: "Tekst onder het logo", name: "tagline", widget: "text", i18n: true }
              - { label: "Regio", name: "regio", widget: "string", i18n: true }
              - { label: "Titel bij de knop", name: "ctaTitel", widget: "string", i18n: true }
              - { label: "Btw-nummer", name: "btw", widget: "string", i18n: duplicate }
          - label: "Sociale media"
            name: "social"
            widget: "object"
            i18n: true
            fields:
              - { label: "Instagram-link", name: "instagram", widget: "string", i18n: duplicate }
              - { label: "LinkedIn-link", name: "linkedin", widget: "string", i18n: duplicate }
              - { label: "Facebook-link", name: "facebook", widget: "string", i18n: duplicate }

  - name: "paginas"
    label: "Pagina's"
    i18n: true
    files:
      - name: "home"
        label: "Home"
        file: "content/{{locale}}/pages/home.json"
        i18n: true
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            i18n: true
            fields:
              - { label: "Bovenschrift", name: "eyebrow", widget: "string", i18n: true }
              - { label: "Tekst onder de titel", name: "subtitel", widget: "text", i18n: true }
          - label: "Wat is Relovation"
            name: "over"
            widget: "object"
            i18n: true
            fields:
              - { label: "Tekst", name: "tekst", widget: "text", i18n: true }
          - label: "Gelegenheden"
            name: "gelegenheden"
            widget: "list"
            i18n: true
            allow_add: false
            allow_delete: false
            fields:
              - { label: "Titel", name: "titel", widget: "string", i18n: true }
              - { label: "Tekst", name: "tekst", widget: "text", i18n: true }
          - label: "Waarom Relovation"
            name: "waarom"
            widget: "object"
            i18n: true
            fields:
              - { label: "Inleiding", name: "intro", widget: "string", i18n: true }
              - label: "Punten"
                name: "punten"
                widget: "list"
                i18n: true
                allow_add: false
                allow_delete: false
                fields:
                  - { label: "Titel", name: "titel", widget: "string", i18n: true }
                  - { label: "Tekst", name: "tekst", widget: "string", i18n: true }
          - label: "Bezettingen"
            name: "bezettingen"
            widget: "list"
            i18n: true
            allow_add: false
            allow_delete: false
            fields:
              - { label: "Instrumenten", name: "instrumenten", widget: "text", i18n: true }
              - { label: "Tekst", name: "tekst", widget: "text", i18n: true }
          - label: "Slotblok"
            name: "cta"
            widget: "object"
            i18n: true
            fields:
              - { label: "Bovenschrift", name: "eyebrow", widget: "string", i18n: true }
              - { label: "Tekst", name: "tekst", widget: "text", i18n: true }

      - name: "diensten"
        label: "Diensten"
        file: "content/{{locale}}/pages/diensten.json"
        i18n: true
        fields:
          - { label: "Inleiding", name: "intro", widget: "text", i18n: true }
          - label: "Diensten"
            name: "diensten"
            widget: "list"
            i18n: true
            allow_add: false
            allow_delete: false
            fields:
              - { label: "Titel", name: "titel", widget: "string", i18n: true }
              - { label: "Tekst", name: "tekst", widget: "text", i18n: true }
              - label: "Punten"
                name: "punten"
                widget: "list"
                i18n: true
                allow_add: false
                allow_delete: false
                field: { label: "Punten", name: "item", widget: "string", i18n: true }
          - label: "Bezettingen"
            name: "bezettingen"
            widget: "list"
            i18n: true
            allow_add: false
            allow_delete: false
            fields:
              - { label: "Naam", name: "naam", widget: "string", i18n: true }
              - { label: "Instrumenten", name: "instrumenten", widget: "string", i18n: true }
              - { label: "Tekst", name: "tekst", widget: "text", i18n: true }
          - { label: "Afsluitende noot", name: "slotnoot", widget: "text", i18n: true }
          - label: "Slotblok"
            name: "cta"
            widget: "object"
            i18n: true
            fields:
              - { label: "Bovenschrift", name: "eyebrow", widget: "string", i18n: true }
              - { label: "Tekst", name: "tekst", widget: "text", i18n: true }

      - name: "over"
        label: "Over ons"
        file: "content/{{locale}}/pages/over.json"
        i18n: true
        fields:
          - { label: "Openingstekst", name: "lede", widget: "text", i18n: true }
          - label: "Inhoudsopgave"
            name: "index"
            widget: "list"
            i18n: true
            allow_add: false
            allow_delete: false
            fields:
              - { label: "Titel", name: "titel", widget: "string", i18n: true }
              - { label: "Tekst", name: "tekst", widget: "string", i18n: true }
          - label: "Ons verhaal"
            name: "verhaal"
            widget: "list"
            i18n: true
            allow_add: false
            allow_delete: false
            field: { label: "Ons verhaal", name: "item", widget: "text", i18n: true }
          - { label: "Citaat", name: "citaat", widget: "string", i18n: true }
          - label: "De kunst van aanwezigheid"
            name: "visie"
            widget: "object"
            i18n: true
            fields:
              - { label: "Inleiding", name: "intro", widget: "text", i18n: true }
              - label: "Punten"
                name: "punten"
                widget: "list"
                i18n: true
                allow_add: false
                allow_delete: false
                fields:
                  - { label: "Titel", name: "titel", widget: "string", i18n: true }
                  - { label: "Tekst", name: "tekst", widget: "text", i18n: true }
          - label: "Onze muzikanten"
            name: "muzikanten"
            widget: "object"
            i18n: true
            fields:
              - { label: "Inleiding", name: "intro", widget: "text", i18n: true }
              - label: "Leden"
                name: "leden"
                widget: "list"
                i18n: true
                allow_add: false
                allow_delete: false
                fields:
                  - { label: "Naam", name: "naam", widget: "string", i18n: true }
                  - { label: "Rol", name: "rol", widget: "string", i18n: true }
                  - { label: "Biografie", name: "bio", widget: "text", i18n: true }
              - { label: "Voetnoot", name: "noot", widget: "text", i18n: true }
          - label: "Hoe wij werken"
            name: "werkwijze"
            widget: "object"
            i18n: true
            fields:
              - { label: "Inleiding", name: "intro", widget: "text", i18n: true }
              - label: "Punten"
                name: "punten"
                widget: "list"
                i18n: true
                allow_add: false
                allow_delete: false
                fields:
                  - { label: "Titel", name: "titel", widget: "string", i18n: true }
                  - { label: "Tekst", name: "tekst", widget: "text", i18n: true }
          - label: "Slotblok"
            name: "cta"
            widget: "object"
            i18n: true
            fields:
              - { label: "Tekst", name: "tekst", widget: "text", i18n: true }

      - name: "gallerij"
        label: "Gallerij"
        file: "content/{{locale}}/pages/gallerij.json"
        i18n: true
        fields:
          - { label: "Inleiding", name: "intro", widget: "string", i18n: true }
          - label: "Bijschriften bij de foto's"
            name: "bijschriften"
            widget: "list"
            i18n: true
            allow_add: false
            allow_delete: false
            field: { label: "Bijschriften bij de foto's", name: "item", widget: "text", i18n: true }
          - label: "Het ensemble"
            name: "ensemble"
            widget: "object"
            i18n: true
            fields:
              - { label: "Inleiding", name: "intro", widget: "text", i18n: true }
              - label: "Leden"
                name: "leden"
                widget: "list"
                i18n: true
                allow_add: false
                allow_delete: false
                fields:
                  - { label: "Naam", name: "naam", widget: "string", i18n: true }
                  - { label: "Instrument", name: "instrument", widget: "string", i18n: true }
          - { label: "Citaat", name: "citaat", widget: "string", i18n: true }
          - label: "Hoe wij spelen"
            name: "spelen"
            widget: "object"
            i18n: true
            fields:
              - { label: "Tekst", name: "tekst", widget: "text", i18n: true }
          - label: "Slotblok"
            name: "cta"
            widget: "object"
            i18n: true
            fields:
