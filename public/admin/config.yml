              - { label: "Omschrijving", name: "description", widget: "text", i18n: true }
          - label: "Aanvraag"
            name: "aanvraag"
            widget: "object"
            i18n: true
            fields:
              - { label: "Titel", name: "title", widget: "string", i18n: true }
              - { label: "Omschrijving", name: "description", widget: "text", i18n: true }
