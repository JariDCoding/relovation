<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><style>
.tri{fill:#4c6a57;fill-opacity:0;stroke:#4c6a57;stroke-width:8;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.go .tri{animation:triDraw 0.55s ease forwards, triFill 0.42s ease 0.5s forwards}
